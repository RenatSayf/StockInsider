apply plugin: 'com.android.application'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'com.google.dagger.hilt.android' //Hint Hilt step 2
apply plugin: 'com.google.gms.google-services'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'
apply plugin: 'com.google.firebase.crashlytics'

android {
    compileSdk 36
    defaultConfig {
        applicationId "com.renatsayf.stockinsider"
        minSdkVersion 26
        //noinspection EditedTargetSdkVersion
        targetSdkVersion 36
        versionCode 39      //Hint The latest versionCode at store is 38
        versionName '4.7'   //Hint The latest versionName at store is 4.5
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

        sourceSets {
            androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
        }

        ksp {
            arg("room.schemaLocation", "$projectDir/schemas".toString())
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    flavorDimensions = ["data_source"]
    productFlavors {
        network {
            buildConfigField 'String', 'DATA_SOURCE', '\"NETWORK\"'
        }
        localhost {
            buildConfigField 'String', 'DATA_SOURCE', '\"LOCALHOST\"'
        }
        timePeriod {
            buildConfigField 'String', 'DATA_SOURCE', '\"TEST_TIME_PERIOD\"'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlin {
        jvmToolchain(21)
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
    namespace 'com.renatsayf.stockinsider'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'com.google.android.material:material:1.13.0'

    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.7'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.7'

    //Hint Enable multidex. Step 1 (https://developer.android.com/studio/build/multidex)
    implementation 'androidx.multidex:multidex:2.0.1'

    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.10.0'
    implementation 'androidx.test.ext:junit-ktx:1.3.0'

    //Hint Hilt step 3
    implementation 'com.google.dagger:hilt-android:2.59.2'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    ksp 'com.google.dagger:hilt-compiler:2.59.2'
    implementation 'androidx.hilt:hilt-work:1.3.0'
    // When using Kotlin.
    ksp 'androidx.hilt:hilt-compiler:1.3.0'

    //jsoup
    implementation 'org.jsoup:jsoup:1.22.1'

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    //room
    implementation 'androidx.room:room-runtime:2.8.4'
    annotationProcessor "androidx.room:room-compiler:2.8.4"

    ksp "androidx.room:room-compiler:2.8.4"
    implementation 'androidx.room:room-ktx:2.8.4'
    testImplementation "android.arch.persistence.room:testing:1.1.1"

    //WorkManager library
    def work_version = "2.11.2"
    // Kotlin + coroutines
    implementation "androidx.work:work-runtime-ktx:$work_version"
    // optional - GCMNetworManager support
    implementation "androidx.work:work-gcm:$work_version"
    // optional - Test helpers
    testImplementation "androidx.work:work-testing:$work_version"

    // Picasso
    implementation 'com.squareup.picasso:picasso:2.71828'

    //Google Play Billing Library
    implementation 'com.android.billingclient:billing-ktx:7.1.1'

    //Firebase platform
    implementation platform('com.google.firebase:firebase-bom:34.11.0')
    implementation 'com.google.firebase:firebase-config'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'

    //Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation "android.arch.core:core-testing:1.1.1"
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.0.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.0.3'

    testImplementation "androidx.test:runner:1.7.0"
    testImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.fragment:fragment-testing:1.8.9'
    androidTestImplementation 'com.google.truth:truth:1.4.5'

    //Robolectric
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'org.robolectric:annotations:4.16.1'

    // MockWebServer
    testImplementation 'com.squareup.okhttp3:mockwebserver:5.3.2'

    // For Robolectric tests.
    testImplementation 'com.google.dagger:hilt-android-testing:2.59.2'
    // ...with Kotlin.
    kspTest 'com.google.dagger:hilt-android-compiler:2.59.2'

    // For instrumented tests.
    androidTestImplementation 'com.google.dagger:hilt-android-testing:2.59.2'
    // ...with Kotlin.
    kspAndroidTest 'com.google.dagger:hilt-android-compiler:2.59.2'

    // Google AdMob
    implementation 'com.google.android.gms:play-services-ads:25.1.0'

    //Splashscreen
    implementation 'androidx.core:core-splashscreen:1.2.0'

    //Kotlin Serialization
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:1.10.0'

}
