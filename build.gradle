// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        kotlin_version = '2.0.21'
    }

    repositories {
        google()
        mavenCentral()

    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.0'
        classpath "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:$kotlin_version-1.0.27"
        classpath 'com.google.gms:google-services:4.4.4'

        //Hint the version must be the same how to com.google.dagger:hilt-android (app module)
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.59.2' //Hint Hilt step 1

        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.6'
    }

}

plugins {
    id "org.jetbrains.kotlin.plugin.serialization" version "2.3.20" apply false
    id "org.jetbrains.kotlin.android" version "2.3.20" apply false
}

allprojects {
    repositories {
        mavenCentral()
        google()
        maven { url 'https://maven.google.com' }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
